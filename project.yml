name: DriveAudioPlayer
options:
  bundleIdPrefix: com.benstrohbeen
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.benstrohbeen.DriveAudioPlayer
targets:
  DriveAudioPlayer:
    type: application
    platform: iOS
    sources:
      - path: DriveAudioPlayer
    settings:
      base:
        INFOPLIST_FILE: DriveAudioPlayer/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: DriveAudioPlayer/Resources/DriveAudioPlayer.entitlements
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GOOGLE_IOS_CLIENT_ID: YOUR_CLIENT_ID.apps.googleusercontent.com
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.YOUR_CLIENT_ID
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: DriveAudioPlayer/Resources/DriveAudioPlayer.entitlements
      properties: {}
